<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="863.28pt" height="364.83pt" viewBox="0 0 1600 676">
  <title>Graphical abstract: nanoparticle segregation and association with nanobubbles</title>
  <desc>Editable vector artwork with separated groups for background, headings, silica nanoparticles, alumina nanoparticles, nanobubbles, ions, and labels.</desc>

  <defs>
    <linearGradient id="headerRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49B9DA"/>
      <stop offset="0.48" stop-color="#85D8E8"/>
      <stop offset="0.52" stop-color="#8FD5CB"/>
      <stop offset="1" stop-color="#36A6A0"/>
    </linearGradient>
    <radialGradient id="bubbleFill" cx="31%" cy="23%" r="79%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.94"/>
      <stop offset="0.16" stop-color="#DDF8FF" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#83D9F2" stop-opacity="0.47"/>
      <stop offset="0.84" stop-color="#27A9D4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A7FAA" stop-opacity="0.20"/>
    </radialGradient>
    <linearGradient id="bubbleRim" x1="0.12" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0" stop-color="#DDFBFF"/>
      <stop offset="0.28" stop-color="#59C9E8"/>
      <stop offset="0.72" stop-color="#168EBE"/>
      <stop offset="1" stop-color="#7DD7EA"/>
    </linearGradient>
    <radialGradient id="silicaFill" cx="29%" cy="22%" r="82%">
      <stop offset="0" stop-color="#FF9B76"/>
      <stop offset="0.18" stop-color="#FF6B52"/>
      <stop offset="0.58" stop-color="#E83335"/>
      <stop offset="1" stop-color="#A9162C"/>
    </radialGradient>
    <linearGradient id="silicaRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB08D"/>
      <stop offset="0.5" stop-color="#E62D36"/>
      <stop offset="1" stop-color="#8E1028"/>
    </linearGradient>
    <radialGradient id="aluminaFill" cx="28%" cy="20%" r="84%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#EEF3F6"/>
      <stop offset="0.62" stop-color="#B7C2C9"/>
      <stop offset="1" stop-color="#737F89"/>
    </radialGradient>
    <linearGradient id="aluminaRim" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#C7D0D6"/>
      <stop offset="1" stop-color="#6F7B85"/>
    </linearGradient>
    <clipPath id="aluminaClip">
      <path d="M-49,-12 L-39,-31 L-20,-44 L5,-42 L22,-35 L43,-17 L46,2 L36,17 L42,30 L20,43 L1,39 L-20,46 L-39,31 L-48,12 Z"/>
    </clipPath>
    <radialGradient id="naFill" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#B9F3A0"/>
      <stop offset="0.24" stop-color="#65D64E"/>
      <stop offset="1" stop-color="#13963B"/>
    </radialGradient>
    <radialGradient id="clFill" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#D5E9FF"/>
      <stop offset="0.24" stop-color="#69A7ED"/>
      <stop offset="1" stop-color="#225CAE"/>
    </radialGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="blur"/>
      <feOffset dy="4" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.20 0 0 0 0 0.29 0 0 0 .20 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="particleShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feOffset dx="1" dy="3" result="offsetBlur"/>
      <feColorMatrix in="offsetBlur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.12 0 0 0 0 0.14 0 0 0 .25 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

