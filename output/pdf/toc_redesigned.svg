      <ellipse cx="-17" cy="-18" rx="14" ry="8" fill="#FFD2BF" opacity="0.58" transform="rotate(-28 -17 -18)"/>
      <path d="M-37,24 C-17,44 18,45 37,21" fill="none" stroke="#811027" stroke-width="2.5" opacity="0.32" stroke-linecap="round"/>
    </g>
