      <circle cx="11" cy="5" r="8.5" fill="url(#clFill)" stroke="#1D55A2" stroke-width="1.2"/>
      <circle cx="-13" cy="-3" r="2.4" fill="#FFFFFF" opacity="0.82"/>
      <circle cx="9" cy="2" r="2.4" fill="#FFFFFF" opacity="0.82"/>
